<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to Image - Utility Hub</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/pages/pdf/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="nav-back">← Back to Hub</a>
            <h1>PDF to Image Converter</h1>
            <p>Convert individual PDF pages or extract all pages into PNG/JPEG format.</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label>Select PDF File:</label>
                <input type="file" id="pdfFileInput" accept="application/pdf" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Page Number:</label>
                    <input type="number" id="pageNumberInput" value="1" min="1" />
                </div>
                <div class="form-group">
                    <label>Output Format:</label>
                    <select id="formatSelect">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <span id="statusText">Ready</span>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="convertSinglePage()">Convert Single Page</button>
                    <button class="btn" onclick="convertAllPages()">Export All (ZIP)</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/pages/pdf/script.js"></script>
</body>
</html>
